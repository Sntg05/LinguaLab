name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy two builds at once, and let a running deploy finish
# rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Fijadas por SHA, igual que en CI: una etiqueta movible seguia siendo el
      # riesgo en el flujo que SI tiene `pages: write` e `id-token: write`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is fully static, so the build must pass the same gate as CI.
      - run: npm run check
      - run: npm run test

      # A project repository is served from a SUBPATH, so every root-absolute
      # URL needs that prefix. Vercel serves from the domain root and leaves
      # SITE_BASE unset, which is why this is set here and not in the source.
      - name: Build for the Pages subpath
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sntg05.github.io' }}
          SITE_BASE: /LinguaLab
        run: npm run build

      - run: npm run verify:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
