name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy two builds at once, and let a running deploy finish
# rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is fully static, so the build must pass the same gate as CI.
      - run: npm run check
      - run: npm run test

      # A project repository is served from a SUBPATH, so every root-absolute
      # URL needs that prefix. Vercel serves from the domain root and leaves
      # SITE_BASE unset, which is why this is set here and not in the source.
      - name: Build for the Pages subpath
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sntg05.github.io' }}
          SITE_BASE: /LinguaLab
        run: npm run build

      - run: npm run verify:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
