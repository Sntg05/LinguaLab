name: CI

on:
  push:
    # Toda rama se verifica en cada push, no solo cuando llega a main: es donde
    # Vercel construye la vista previa, y "pasa en la maquina de quien lo
    # escribio" no es lo mismo que "pasa en el runner". Antes habia que agregar
    # cada rama de trabajo a mano a una lista, y la lista guardaba cuatro ramas
    # ya fusionadas cuando se audito el 2026-11-03.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Una rama con un PR abierto recibe dos eventos por commit (`push` y
# `pull_request`), con refs distintos. Agruparlos por repositorio y nombre de
# rama hace que corra una sola vez por commit. El repositorio va en la clave
# para que el PR de un fork con una rama llamada igual (o `main`) no cancele la
# CI de este repositorio.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Las acciones van fijadas por SHA completo, no por etiqueta. Una etiqueta
      # como `@v4` es una referencia movible: quien controle la accion puede
      # moverla y ejecutar codigo en el runner con el token del proyecto. El
      # comentario con la version mayor queda al lado para que Dependabot siga
      # proponiendo subidas y para que un humano lea que version es. Ver O2 en
      # `docs/SECURITY-REVIEW.md`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # La puerta no auditaba dependencias: un aviso nuevo no rompia nada y
      # nadie se enteraba hasta mirar el panel. Bloquea solo el arbol de
      # produccion y solo a partir de `high`; el arbol de desarrollo se informa
      # y no corta, porque sus avisos no llegan al artefacto publicado y
      # bloquear por ellos convertiria cada aviso en una emergencia.
      # Ver O1 en `docs/SECURITY-REVIEW.md`.
      - name: Audit production dependencies
        run: npm run audit

      # Va primero porque es lo más barato de arreglar: un problema de estilo o
      # de imports no debería hacer esperar a los pasos lentos que vienen detrás.
      - name: Lint
        run: npm run lint

      # El linter no opina sobre el formato, y durante un tiempo eso dejo un hueco:
      # `format:check` existia en package.json y no lo invocaba nadie, ni la puerta
      # local ni este workflow, asi que un archivo mal indentado pasaba todo. Un
      # verde que no significa lo que dice es peor que un rojo, porque un verde no
      # lo investiga nadie.
      - name: Format
        run: npm run format:check

      # Esta es la forma ejecutable del ADR 0001: las flechas de la arquitectura
      # apuntan hacia adentro (la UI y los adaptadores conocen el núcleo, nunca al
      # revés). Si alguien invierte una flecha, CI la rechaza aquí en lugar de
      # dejar que el acoplamiento se extienda por el repositorio.
      - name: Hexagonal dependency rules
        run: npm run deps:check

      # `astro check` solo mira el sitio: los paquetes del workspace compilan con
      # su propio tsconfig y de otro modo llegarían al merge sin nadie leerlos.
      - name: Type check the workspace packages
        run: npm run typecheck:packages

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Fails on: an unhashed inline script, 'unsafe-inline' creeping back into
      # the CSP, a third-party subresource, a duplicate <h1>, or a page that
      # outgrows its performance budget.
      - name: Verify build output
        run: npm run verify:build

      # Playwright necesita su propio navegador y las bibliotecas del sistema que
      # este no arrastra. Se cachea porque la descarga es lo mas caro del job y no
      # cambia mientras no cambie la version de Playwright: la clave incluye el
      # lockfile, asi que una actualizacion la invalida sola.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # La puerta de accesibilidad tiene que correr donde corre todo lo demas, y
      # no solo en la maquina de quien la escribio. Esta prueba ya encontro una
      # violacion critica en produccion —`aria-pressed` sobre un enlace, que ARIA
      # no permite fuera de los roles de boton— y el proyecto declara WCAG 2.2 AA
      # como requisito, no como intencion.
      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          retention-days: 7
